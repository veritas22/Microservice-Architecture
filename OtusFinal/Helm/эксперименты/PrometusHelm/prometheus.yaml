prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    enableOTLPReceiver: true
    otlp:
      listenAddress: "otel-opentelemetry-collector:8889"
      promoteResourceAttributes:
        - service.instance.id
        - service.name
        - service.namespace
        - cloud.availability_zone
        - cloud.region
        - container.name
        - deployment.environment.name
        - k8s.cluster.name
        - k8s.container.name
        - k8s.cronjob.name
        - k8s.daemonset.name
        - k8s.deployment.name
        - k8s.job.name
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.replicaset.name
        - k8s.statefulset.name
      translationStrategy: NoUTF8EscapingWithSuffixes
    tsdb:
      outOfOrderTimeWindow: 30m
  service:
    additionalPorts:
      - name: otlp-custom
        port: 8889
        targetPort: 8889

  extraArgs:
    - web.enable-otlp-receiver

