apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-deployment
  labels:
    app: {{ .Release.Name }}-deployment
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{.Values.netserv}}
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: {{.Values.netserv}}
    spec:
      containers:
        - name: {{ .Release.Name }}
          image: gabbazovr/billing:latest
          readinessProbe:
              httpGet:
                path: /health
                port: {{.Values.targetport}}
              initialDelaySeconds: 5
              periodSeconds: 3
          livenessProbe:
              httpGet:
                path: /health
                port: {{.Values.targetport}}
              initialDelaySeconds: 5
              periodSeconds: 3
          ports:
            - containerPort: {{.Values.targetport}}
              protocol: TCP
            - protocol: TCP
              containerPort: {{.Values.targetportgrps}}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-configmap
            - secretRef:
                name: {{ .Release.Name }}-secret